# CyberDotfiles — TLP 1.11 cho Dell Latitude E7470 (i7-6600U / HD 520)
# Đo thực tế: EPP=power trên pin khiến CPU kẹt 800-900 MHz kể cả khi full tải;
# balance_performance lên 3.2 GHz tức thì => nguyên nhân lag khi dùng pin.
# CHỈ dùng tên mới (_PRF/_BAL/_SAV). Tên cũ _AC/_BAT trong /etc/tlp.conf sẽ bị dịch
# đè lên file này, nên install.sh comment chúng lại.
CPU_ENERGY_PERF_POLICY_ON_PRF=performance
CPU_ENERGY_PERF_POLICY_ON_BAL=balance_performance
CPU_ENERGY_PERF_POLICY_ON_SAV=balance_power
CPU_BOOST_ON_PRF=1
CPU_BOOST_ON_BAL=1
