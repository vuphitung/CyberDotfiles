# ╔══════════════════════════════════════════════════════════╗
# ║           CYBERTUNG — HYPRLAND CONFIG v5                ║
# ║           Arch Linux + Hyprland + AGS Shell             ║
# ╚══════════════════════════════════════════════════════════╝

# ── BIẾN ────────────────────────────────────────────────────
$mainMod = SUPER
$scripts  = ~/CyberDotfiles/scripts
$shell    = ~/CyberDotfiles/shell

# ── MÀN HÌNH ────────────────────────────────────────────────
monitor = , preferred, auto, 1

# ── KHỞI ĐỘNG ───────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = swww-daemon &
exec-once = swaync &
exec-once = fcitx5 -d &
exec-once = nm-applet --indicator &
exec-once = tlp start
exec-once = sleep 3 && bash $scripts/wallpaper.sh

# ── NHẬP LIỆU ───────────────────────────────────────────────
input {
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0
    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

# ── GIAO DIỆN CHUNG ─────────────────────────────────────────
general {
    gaps_in  = 5
    gaps_out = 10
    border_size = 2
    col.active_border   = rgba(00e5ffee) rgba(7c3aedee) 45deg
    col.inactive_border = rgba(1e293baa)
    layout = dwindle
}

# ── TRANG TRÍ ───────────────────────────────────────────────
decoration {
    rounding = 12
    active_opacity   = 1.0
    inactive_opacity = 0.92

    blur {
        enabled           = true
        size              = 8
        passes            = 2
        new_optimizations = true
        ignore_opacity    = true
        brightness        = 1.1
        contrast          = 1.0
        vibrancy          = 0.1
    }

    shadow {
        enabled      = true
        range        = 20
        render_power = 3
        color        = rgba(00e5ff18)
    }
}

# ── ANIMATION ───────────────────────────────────────────────
animations {
    enabled = true

    bezier = smooth,  0.25, 1,    0.25, 1
    bezier = snappy,  0.4,  0,    0.2,  1
    bezier = pop,     0.1,  0.9,  0.2,  1

    # Bỏ bounce + slide — nặng Intel iGPU
    animation = windows,    1, 3, pop,    popin 80%
    animation = windowsOut, 1, 2, smooth, popin 80%
    animation = windowsMove,1, 3, snappy
    animation = fade,       1, 3, smooth
    animation = workspaces, 1, 3, snappy, slidevert
    animation = layers,     1, 2, smooth, fade
}

# ── LAYOUT ──────────────────────────────────────────────────
dwindle {
    
    
    
}

# ── MISC ────────────────────────────────────────────────────
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0
    animate_manual_resizes   = true
    enable_swallow           = false
    
}

# ╔══════════════════════════════════════════════════════════╗
# ║                      PHÍM TẮT                           ║
# ╚══════════════════════════════════════════════════════════╝

# ── MỞ ỨNG DỤNG ─────────────────────────────────────────────
bind = $mainMod,       Q,     exec, kitty
bind = $mainMod,       E,     exec, nautilus
bind = $mainMod,       G,     exec, google-chrome-stable
bind = $mainMod,       SPACE, exec, rofi -show drun

# ── HỆ THỐNG ────────────────────────────────────────────────
bind = $mainMod,       C,  killactive
bind = $mainMod,       F,  fullscreen, 0
bind = $mainMod,       V,  togglefloating
bind = $mainMod,       L,  exec, wlogout
bind = $mainMod,       P,  exec, hyprlock
bind = $mainMod,       I,  exec, swaync-client -t
bind = $mainMod,       F1, exec, $scripts/keyhints.sh
bind = $mainMod,       W,  exec, kitty --class wall-picker $scripts/wall-picker.sh
bind = $mainMod,       Tab,workspace, previous

# ── CHỤP MÀN HÌNH ───────────────────────────────────────────
bind = $mainMod SHIFT, S, exec, grimblast --notify save area ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png
bind = ,         Print,   exec, grimblast --notify save screen ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

# ── DI CHUYỂN FOCUS ─────────────────────────────────────────
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# ── RESIZE (submap) ─────────────────────────────────────────
bind  = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive,  10 0
binde = , left,  resizeactive, -10 0
binde = , up,    resizeactive,  0 -10
binde = , down,  resizeactive,  0  10
bind  = , escape, submap, reset
submap = reset

# ── WORKSPACES ──────────────────────────────────────────────
bind = $mainMod,       1, workspace, 1
bind = $mainMod,       2, workspace, 2
bind = $mainMod,       3, workspace, 3
bind = $mainMod,       4, workspace, 4
bind = $mainMod,       5, workspace, 5
bind = $mainMod,       6, workspace, 6
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# ── MEDIA KEYS ──────────────────────────────────────────────
bindle = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
bindle = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── CHUỘT ───────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── SOURCE USER OVERRIDES ───────────────────────────────────
# Đặt override ở đây, không sửa file này trực tiếp
source = ~/.config/hypr/user.conf
