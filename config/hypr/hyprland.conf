# ╔══════════════════════════════════════════════════════════╗
# ║   CYBERTUNG — HYPRLAND CONFIG v6                        ║
# ║   Hyprland 0.56 (hyprlang) · Dell E7470 · HD 520        ║
# ╚══════════════════════════════════════════════════════════╝
# Sau mỗi lần sửa/reload, chạy:  hyprctl configerrors
# Hyprland >= 0.55 đã deprecate hyprlang (chuyển sang Lua). File này vẫn chạy,
# nhưng nên lên kế hoạch chuyển sang hyprland.lua.

# ── BIẾN ────────────────────────────────────────────────────
# Màu/token dùng chung (sinh từ themes/sakura-glass.json bởi scripts/theme-gen.py)
source = ~/.config/hypr/tokens.conf

$mainMod = SUPER
$scripts = ~/CyberDotfiles/scripts

# ── MÀN HÌNH ────────────────────────────────────────────────
# Panel 14" 2560x1440 (~210 DPI). scale 1 => chữ rất nhỏ.
# Muốn nét + dễ đọc: đổi 1 -> 1.333333 (đúng 1920x1080 logic).
monitor = eDP-1, 2560x1440@60, 0x0, 1
monitor = , preferred, auto, 1

# ── KHỞI ĐỘNG ───────────────────────────────────────────────
# Không dùng sleep: wallpaper.sh tự chờ daemon sẵn sàng.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprpolkitagent
exec-once = awww-daemon
exec-once = swaync
exec-once = fcitx5 -d
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = bash $scripts/wallpaper.sh
exec-once = waybar
exec-once = bash $scripts/power-auto.sh
# nm-applet đã bỏ: Waybar có module network (bấm -> nm-connection-editor).
# tlp đã bỏ: xung đột power-profiles-daemon, và `tlp start` không chạy được bằng user thường.

# ── NHẬP LIỆU ───────────────────────────────────────────────
input {
    kb_layout    = us
    follow_mouse = 1
    sensitivity  = 0
    repeat_rate  = 40
    repeat_delay = 300
    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

# ── GIAO DIỆN CHUNG ─────────────────────────────────────────
general {
    gaps_in  = 5
    gaps_out = 12      # khớp margin 12px hai bên của Waybar
    border_size = 2
    col.active_border   = $col_pink          # Sakura Pink
    col.inactive_border = $col_border_off
    layout = dwindle
}

# ── TRANG TRÍ — SAKURA GLASS (đã tối ưu HD 520 @ 1440p) ─────
# Kính mờ do COMPOSITOR làm. Giữ blur nhẹ (size 4, passes 2, xray) — nặng hơn
# (size 8 / passes 3 / xray off) từng làm lag máy này. Vẫn đủ "kem mịn" nhờ vibrancy.
decoration {
    rounding         = 14
    rounding_power   = 4      # 2 = tròn thường, 4 = squircle kiểu Apple
    active_opacity   = 1.0
    inactive_opacity = 1.0
    dim_inactive     = false

    blur {
        enabled           = true
        size              = 4
        passes            = 2
        xray              = true
        new_optimizations = true
        ignore_opacity    = true
        vibrancy          = 0.15
    }

    # Bóng nhẹ cho cửa sổ nổi khối. Nặng máy -> Super+Shift+B (perf-mode) tắt luôn.
    shadow {
        enabled      = true
        range        = 12
        render_power = 3
        color        = $col_shadow
    }
}

# ── KÍNH MỜ CHO LAYER (cú pháp Hyprland >= 0.53) ────────────
# ignore_alpha: chỉ blur chỗ có màu -> kính bo đúng theo góc tròn, không lộ viền vuông.
# Tên namespace kiểm tra bằng:  hyprctl layers
layerrule = match:namespace ^(waybar)$,                blur on, ignore_alpha 0.1
layerrule = match:namespace ^(rofi)$,                  blur on, ignore_alpha 0.1
layerrule = match:namespace ^(logout_dialog)$,         blur on, ignore_alpha 0.1
layerrule = match:namespace ^(swaync-control-center)$, blur on, ignore_alpha 0.1
layerrule = match:namespace ^(swaync-notification-window)$, blur on, ignore_alpha 0.1

# ── ANIMATION ───────────────────────────────────────────────
animations {
    enabled = true

    bezier = appleEase, 0.25, 1,  0.5,  1     # macOS-style ease-out
    bezier = smooth,  0.25, 1,    0.25, 1
    bezier = snappy,  0.4,  0,    0.2,  1
    bezier = pop,     0.1,  0.9,  0.2,  1

    animation = windows,     1, 3, pop,    popin 80%
    animation = windowsOut,  1, 2, smooth, popin 80%
    animation = windowsMove, 1, 3, smooth
    animation = fade,        1, 3, appleEase
    animation = workspaces,  1, 3, snappy, slidevert
    animation = layers,      1, 3, appleEase, fade
}

# ── CON TRỎ ─────────────────────────────────────────────────
# KHÔNG đặt no_hardware_cursors = true: trên Intel nó ép vẽ cursor bằng phần mềm,
# chặn direct scanout (đã đo: hardwareCursorsInUse=false).
cursor {
    inactive_timeout = 3
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0
    animate_manual_resizes   = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
}

# ╔══════════════════════════════════════════════════════════╗
# ║   PHÍM TẮT (bindd = có mô tả; keyhints.sh tự đọc)       ║
# ╚══════════════════════════════════════════════════════════╝
# Mô tả KHÔNG được chứa dấu phẩy.

bindd = $mainMod, Q,     Mở Terminal,    exec, kitty
bindd = $mainMod, E,     Quản lý File,   exec, nautilus
bindd = $mainMod, G,     Trình duyệt,    exec, google-chrome-stable
bindd = $mainMod, SPACE, Tìm kiếm App,   exec, rofi -show drun

bindd = $mainMod, C,   Đóng cửa sổ,       killactive
bindd = $mainMod, F,   Toàn màn hình,     fullscreen, 0
bindd = $mainMod, V,   Cửa sổ nổi,        togglefloating
bindd = $mainMod, J,   Đổi hướng split,   layoutmsg, togglesplit
bindd = $mainMod, L,   Menu nguồn,        exec, wlogout
bindd = $mainMod, P,   Khóa màn hình,     exec, loginctl lock-session
bindd = $mainMod, I,   Thông báo,         exec, swaync-client -t
bindd = $mainMod, B,   Bảng điều khiển,   exec, swaync-client -t -sw
bindd = $mainMod, F1,  Xem phím tắt,      exec, $scripts/keyhints.sh
bindd = $mainMod, W,   Đổi hình nền,      exec, kitty --class wall-picker $scripts/wall-picker.sh
bindd = $mainMod, Tab, Workspace trước,   workspace, previous
bindd = $mainMod SHIFT, V, Lịch sử clipboard, exec, bash -c 'cliphist list | rofi -dmenu -p Clipboard | cliphist decode | wl-copy'
bindd = $mainMod SHIFT, B, Chế độ tiết kiệm pin, exec, $scripts/perf-mode.sh
# Lối thoát khẩn cấp nếu wlogout hỏng:
bindd = $mainMod CTRL SHIFT, Q, Thoát Hyprland, exit,

bindd = $mainMod SHIFT, S, Chụp vùng chọn,    exec, grimblast --notify save area ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png
bindd = ,         Print,   Chụp toàn màn hình, exec, grimblast --notify save screen ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png

bindd = $mainMod, left,  Focus trái,  movefocus, l
bindd = $mainMod, right, Focus phải,  movefocus, r
bindd = $mainMod, up,    Focus lên,   movefocus, u
bindd = $mainMod, down,  Focus xuống, movefocus, d

bindd  = $mainMod, R, Chế độ resize, submap, resize
submap = resize
binde = , right, resizeactive,  10 0
binde = , left,  resizeactive, -10 0
binde = , up,    resizeactive,  0 -10
binde = , down,  resizeactive,  0  10
bind  = , escape, submap, reset
submap = reset

bindd = $mainMod, 1, Chuyển workspace 1, workspace, 1
bindd = $mainMod, 2, Chuyển workspace 2, workspace, 2
bindd = $mainMod, 3, Chuyển workspace 3, workspace, 3
bindd = $mainMod, 4, Chuyển workspace 4, workspace, 4
bindd = $mainMod, 5, Chuyển workspace 5, workspace, 5
bindd = $mainMod, 6, Chuyển workspace 6, workspace, 6
bindd = $mainMod SHIFT, 1, Đưa cửa sổ sang workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Đưa cửa sổ sang workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Đưa cửa sổ sang workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Đưa cửa sổ sang workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Đưa cửa sổ sang workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Đưa cửa sổ sang workspace 6, movetoworkspace, 6

bindle = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous
bindle = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── WINDOW RULES (cú pháp mới từ Hyprland 0.53) ─────────────
windowrule = match:class ^(wall-picker)$, float on
windowrule = match:class ^(wall-picker)$, size 1100 700
windowrule = match:class ^(wall-picker)$, center on

source = ~/.config/hypr/user.conf

# Rise of Kingdoms (Wine)
windowrule = match:class ^(launcher\.exe|mass\.exe|explorer\.exe)$, float on
windowrule = match:class ^(mass\.exe)$, center on
windowrule = match:class ^(mass\.exe)$, size 1280 720
