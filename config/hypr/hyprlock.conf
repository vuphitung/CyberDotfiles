# ╔══════════════════════════════════════════════════════════════╗
# ║  CYBERTUNG // NEBULA CONTROL DECK — Hyprlock v0.9          ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Background ────────────────────────────────────────────────
# Pywal wallpaper with light blur + dark tint. blur_passes kept
# low for Intel HD 520 — the dark color overlay does the heavy
# lifting for contrast instead.
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    noise = 0.02
    contrast = 0.9
    brightness = 0.4
    vibrancy = 0.15
    vibrancy_darkness = 0.3
    color = rgb(0a0a12)
}

# ── Clock ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 120
    font_family = JetBrainsMono Nerd Font
    color = rgb(ffffff)
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgb(00e5ff)
    shadow_boost = 0.4
}

# ── Date ──────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgb(00e5ff)
    position = 0, 180
    halign = center
    valign = center
}

# ── Decorative separator ─────────────────────────────────────
# Thin line of Unicode box-drawing chars for subtle structure
label {
    monitor =
    text = ─────────────────────────────
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    color = rgba(124, 58, 237, 0.5)
    position = 0, 140
    halign = center
    valign = center
}

# ── User greeting ─────────────────────────────────────────────
label {
    monitor =
    text =  $USER
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.7)
    position = 0, 80
    halign = center
    valign = center
}

# ── Password input ────────────────────────────────────────────
# Capsule shape: wide+short with large rounding
input-field {
    monitor =
    size = 360, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(00e5ff)
    inner_color = rgba(10, 10, 18, 0.85)
    font_color = rgb(ffffff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="#555555">⟫ AUTHENTICATE ⟪</span>
    hide_input = false
    rounding = 25
    check_color = rgb(7c3aed)
    fail_color = rgb(f87171)
    fail_text = <span foreground="#f87171">⚠ ACCESS DENIED</span>
    fail_timeout = 2000
    fail_transition = 200
    capslock_color = rgb(f59e0b)
    position = 0, 10
    halign = center
    valign = center
}

# ── Lock status hint ─────────────────────────────────────────
label {
    monitor =
    text = NEBULA CONTROL DECK // LOCKED
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    color = rgba(255, 255, 255, 0.25)
    position = 0, -50
    halign = center
    valign = center
}
