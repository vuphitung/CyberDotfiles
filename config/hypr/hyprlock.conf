# ╔══════════════════════════════════════════════════════════════╗
# ║  HYPRLOCK — SAKURA GLASS                                     ║
# ╚══════════════════════════════════════════════════════════════╝
# Màu lấy từ tokens.conf (sinh từ themes/sakura-glass.json).
source = ~/.config/hypr/tokens.conf

# Nền: ảnh chụp màn hình + blur nhẹ. blur_passes giữ thấp cho Intel HD 520.
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    noise = 0.02
    contrast = 0.95
    brightness = 0.6
    vibrancy = 0.15
    vibrancy_darkness = 0.2
    color = $col_glass_strong
}

# Giờ — chữ lớn, mảnh, kiểu màn hình khóa Apple
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 120
    font_family = $font_ui
    color = $col_text
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $col_shadow
}

# Ngày
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = $font_ui
    color = $col_pink_solid
    position = 0, 180
    halign = center
    valign = center
}

# Lời chào
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = $font_ui
    color = $col_text_muted
    position = 0, 100
    halign = center
    valign = center
}

# Ô mật khẩu — viên thuốc kính mờ
input-field {
    monitor =
    size = 360, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $col_pink_solid
    inner_color = $col_glass_strong
    font_color = $col_text
    font_family = $font_ui
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##f5f5f78c">Nhập mật khẩu</span>
    hide_input = false
    rounding = 25
    check_color = $col_green
    fail_color = $col_red
    fail_text = <span foreground="##ff453a">Sai mật khẩu</span>
    fail_timeout = 2000
    fail_transition = 200
    capslock_color = $col_amber
    position = 0, 10
    halign = center
    valign = center
}
