cursor {
    inactive_timeout    = 3
    no_hardware_cursors = false
    persistent_warps    = true
}

animations {
    animation = windowsMove, 1, 3, smooth
}

decoration {
    rounding = 12

    blur {
        enabled           = true
        size              = 6
        passes            = 2
        new_optimizations = true
        ignore_opacity    = true
        brightness        = 1.1
        contrast          = 1.0
        vibrancy          = 0.1
    }

    dim_inactive = true
    dim_strength = 0.12
    dim_special  = 0.2
}

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Breeze
env = WLR_NO_HARDWARE_CURSORS,0
