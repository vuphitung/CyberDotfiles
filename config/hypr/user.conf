# user.conf — override cá nhân, được source CUỐI CÙNG.
# Đừng lặp lại blur/animation ở đây (bản cũ lặp nên hai file lệch nhau).

# Cursor — cần: sudo pacman -S breeze
env = XCURSOR_THEME,Breeze
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Gõ tiếng Việt (fcitx5). Trước đây các biến này nằm NGOÀI repo (cài lại là mất).
# Sau khi chép file này, xóa khai báo cũ (~/.zprofile, /etc/environment...)
env = XMODIFIERS,@im=fcitx
env = QT_IM_MODULE,fcitx
env = GTK_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx
